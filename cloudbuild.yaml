steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - '-t'
      - 'gcr.io/$PROJECT_ID/html-carto-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/html-carto-api:latest'
      - '.'
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - 'gcr.io/$PROJECT_ID/html-carto-api:$COMMIT_SHA'
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - 'gcr.io/$PROJECT_ID/html-carto-api:latest'
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - html-carto-api
      - '--image'
      - 'gcr.io/$PROJECT_ID/html-carto-api:$COMMIT_SHA'
      - '--region'
      - europe-west1
      - '--platform'
      - managed
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/html-carto-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/html-carto-api:latest'

options:
  logging: CLOUD_LOGGING_ONLY
